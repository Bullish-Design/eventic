# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
#
# eventic — a repoman-managed Python devenv repo.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

  # Required for languages.python.version to resolve. eventic declares
  # requires-python = ">=3.13" and CI pins the 3.13 matrix leg; without this
  # input the version pin is silently ignored and the shell serves whatever
  # nixpkgs rolling currently defaults to (3.14 as of this writing).
  nixpkgs-python:
    url: github:cachix/nixpkgs-python

  # RepoMan meta-module: one import wires in the selected *man managers and their
  # tasks and scripts. The host profile puts copyroom, gitman, docman, and testee
  # on PATH, so this file declares no input that provides manager commands.
  # The central Devman overlay imports only the Devman link module. It must not
  # import the RepoMan module: devenv fails with "option repoman.enable is
  # already declared". The roster lives in `.repoman/project.toml`.
  repoman:
    url: "git+https://github.com/Bullish-Design/repoman?dir=modules&ref=refs/tags/v0.12.1"
    flake: false

imports:
  - repoman
