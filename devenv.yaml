# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
#
# eventic — a repoman-managed Python devenv repo.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

  # Required for languages.python.version to resolve. eventic declares
  # requires-python = ">=3.13" and CI pins the 3.13 matrix leg; without this
  # input the version pin is silently ignored and the shell serves whatever
  # nixpkgs rolling currently defaults to (3.14 as of this writing).
  nixpkgs-python:
    url: github:cachix/nixpkgs-python

