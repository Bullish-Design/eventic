# Advisory project metadata, read by copyroom (inspect/status) and repoman.
# Every field is optional and defaulted; this declares origin, conventions, hooks.
copyroom:
  version: 1

project:
  kind: generated-project
  name: eventic
  template_id: py
  template_ref_policy: tagged
  answers_file: .copier-answers.yml

git:
  default_branch: main
  require_clean_worktree: true

context:
  docs: [README.md]
  source: [src/, tests/]
  config: [pyproject.toml, .copier-answers.yml, .repoman/project.toml, .devman/project.toml]

devenv:
  enabled: true
  shell_command: devenv shell

agent:
  # Agent-files convention (copyroom docs/user/agent-files.md): skills live at
  # .agents/skills/, AGENTS.md is canonical, CLAUDE.md symlinks to it, and
  # `overlay` declares skills this repo permanently diverges on (mapped to
  # Copier --exclude on update). All fields defaulted; unknown fields ignored.
  skills_dir: .agents/skills
  instructions: AGENTS.md
  claude_symlink: true
  overlay: []

commands:
  # Birth (runs only with `copyroom new --trust`): verify the RepoMan wiring,
  # fill the venv (this writes uv.lock), put the repo under native jj
  # (colocated with git), and seed trunk's first commit from the rendered files.
  # gitman 0.12 has one verb, `gitman work`, so jj does the rest. `jj` comes
  # from the host profile. There is no publish lane: run the `eventic:lint` and
  # `eventic:test` tasks before you push.
  post_project_create:
    - "devenv shell -- repoman-sync"
    - "devenv shell -- uv sync --all-extras"
    - "jj git init --colocate"
    - "jj describe -m 'Initial generation'"
    - "jj bookmark create main -r @"
    - "jj new"
  check:
    - "devenv shell -- repoman doctor"
