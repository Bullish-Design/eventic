name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eventic
          POSTGRES_PASSWORD: eventic
          POSTGRES_DB: eventic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EVENTIC_PG_URL: postgresql+psycopg://eventic:eventic@localhost:5432/eventic
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --extra test --extra postgres --extra migrate
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run basedpyright
      - name: Test
        run: uv run pytest -W error
      - name: Build
        run: uv build
