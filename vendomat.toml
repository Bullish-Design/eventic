# Vendomat project manifest.
#
# Project 039 moved these settings out of devenv.nix, which declared them
# against the vendomat module this repository used to pin directly. The module
# now arrives from the system profile and reads them here.
#
# The `[toolchain] enable = false` opt-out is gone. It was the matching half of
# `cliProvider = "venv"` in .repoman/project.toml, and the venv provider no
# longer exists — keeping the opt-out would leave this repo with no manager
# commands at all. The defaults now apply: toolchain.enable = true,
# toolchain.mode = "store".

[vendor.publish]
# The publish face installs a pre-push git hook whenever a vendomat.toml exists,
# because file presence is the opt-in. Decline the hook explicitly.
enable = false
