[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "eventic"
version = "0.1.5"
description = "DBOS backed event based pydantic models."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "alembic>=1.13",               # migrations
    "sqlalchemy>=2.0.43",          # the core store
    "pydantic>=2.0",               # Record is a plain pydantic model
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
dbos = [                       # optional durable delivery + FastAPI wiring
    "dbos>=2.29.0,<3.0",
    "fastapi>=0.115.2",
    "uvicorn>=0.30",
]
pg = ["psycopg[binary]>=3.1"]       # Postgres driver for connect(postgresql://...) (D11)
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",   # fastapi TestClient
]

[project.scripts]
eventic-example = "eventic.examples.demo:main"   # fixed in Step 6 (M2)

[tool.hatch.build.targets.wheel]
packages = ["src/eventic"]

[tool.pytest.ini_options]
markers = [
    "postgres: integration tests requiring a live Postgres service (CI only)",
]

#[tool.hatch.build.targets.sdist]
#include = ["src/examples/**"]
