[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "eventic"
version = "1.1.2"
description = "A versioned document store with transactional change notification."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy>=2.0.43",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
migrate = ["alembic>=1.13"]
test = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "coverage>=7.0",
    "basedpyright>=1.39",
    "ruff>=0.15",
]

[project.scripts]
eventic = "eventic.cli.main:main"

[project.urls]
Repository = "https://github.com/Bullish-Design/eventic"

[tool.hatch.build.targets.wheel]
packages = ["src/eventic"]
artifacts = ["src/eventic/py.typed"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.scratch",
    "/probes",
    "/uv.lock",
    "/.venv",
    "/tests",
    "/.github",
]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "postgres: integration tests requiring a live Postgres service (CI only)",
    "slow: wheel/clean-install tests that build and install artifacts",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [".venv", "build", "dist", ".scratch", ".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src/eventic"]
exclude = [".venv", "build", "dist"]
