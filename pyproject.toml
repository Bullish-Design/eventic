[project]
name = "eventic"
version = "1.0.0"
description = "A versioned document store with transactional change notification."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
  { name = "Bullish Design", email = "BullishDesignEngineering@gmail.com" },
]

dependencies = [
  "pydantic>=2",
]

# The dev group declares the check tools (pytest, ruff, ty) directly: Testee
# carries none of them. Testee is a host-profile command, not a dependency of
# this project. `testee.prepare` in devenv.nix runs `uv sync --locked`, so keep
# `uv.lock` in Git. Testee's Nix module in devenv.nix declares the checks.
# The host profile puts the managers (copyroom, gitman) and `testee` on PATH.
[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "ty",
]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventic"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
